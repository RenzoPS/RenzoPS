<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Renzo Piris — Full Stack Developer and AI Engineer. Java, Spring Boot, React, TypeScript, Docker. Buenos Aires, Argentina.">
  <title>Renzo Piris — Full Stack Developer &amp; AI Engineer</title>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="70%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#12181f"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f0883e"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.42" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <mask id="dotmask">
      <rect width="1280" height="300" fill="url(#fade)"/>
    </mask>

    <style>
      /* JetBrains Mono, subset to the glyphs used here and embedded so the
         banner renders identically wherever GitHub serves it. */
      @font-face { font-family: "JBM-XB"; src: url(data:font/woff2;base64,) format("woff2"); }
      @font-face { font-family: "JBM-MD"; src: url(data:font/woff2;base64,) format("woff2"); }
      @font-face { font-family: "JBM-RG"; src: url(data:font/woff2;base64,) format("woff2"); }

      .name { font-family: "JBM-XB", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
      .role { font-family: "JBM-MD", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
      .body { font-family: "JBM-RG", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="300" fill="url(#surface)"/>
  <rect width="1280" height="300" fill="url(#dots)" mask="url(#dotmask)" opacity="0.10"/>
  <rect x="0.5" y="0.5" width="1279" height="299" fill="none" stroke="#21262d" stroke-width="1"/>

  <text class="body" x="80" y="66" font-size="20" fill="#7d8590"><tspan fill="#f0883e">$</tspan> whoami<tspan fill="#f0883e" dx="6">█<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <text class="body" x="1200" y="66" font-size="17" fill="#7d8590" text-anchor="end"><tspan fill="#3fb950">●</tspan> available for freelance</text>

  <text class="name" x="80" y="158" font-size="70" letter-spacing="-1" fill="#e6edf3">Renzo Piris</text>

  <text class="role" x="80" y="208" font-size="25" fill="#f0883e">Full Stack Developer &amp; AI Engineer</text>

  <text class="body" x="80" y="240" font-size="18" fill="#7d8590">Java · Spring Boot · React · TypeScript · Docker</text>

  <text class="body" x="1200" y="240" font-size="17" fill="#7d8590" text-anchor="end">Buenos Aires, Argentina</text>
</svg>
